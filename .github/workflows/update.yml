name: Update package versions

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update:
    name: Update package versions

    runs-on: macos-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.BREW_COMMIT_APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Checkout Git repository
        uses: actions/checkout@v6
      - run: brew test-bot --only-cleanup-before
      - run: brew test-bot --only-setup
      - name: List casks in tap
        id: list-casks
        # List cask files in Casks directory, remove .rb extension, prefix with "jonahsnider/frc/", join with spaces
        run: |
          casks=$(find Casks -maxdepth 1 -name "*.rb" -type f -exec basename {} .rb \; | sed 's/^/jonahsnider\/frc\//' | tr '\n' ' ')
          echo "casks=$casks" >> "$GITHUB_OUTPUT"
      - name: List formulae in tap
        id: list-formulae
        # List formula files in Formula directory, remove .rb extension, prefix with "jonahsnider/frc/", join with spaces
        run: |
          formulae=$(find Formula -maxdepth 1 -name "*.rb" -type f -exec basename {} .rb \; | sed 's/^/jonahsnider\/frc\//' | tr '\n' ' ')
          echo "formulae=$formulae" >> "$GITHUB_OUTPUT"
      - name: Bump packages
        uses: Homebrew/actions/bump-packages@main
        with:
          token: ${{ steps.app-token.outputs.token }}
          casks: ${{ steps.list-casks.outputs.casks }}
          formulae: ${{ steps.list-formulae.outputs.formulae }}
          fork: false
      - name: Install GitHub CLI
        run: brew install gh
      - name: Request review on open PRs
        run: |
          gh pr list --author "app/github-actions" --state open --json number --jq '.[].number' | while read -r pr; do
            gh pr edit "$pr" --add-reviewer "$REPO_OWNER" --add-assignee "$REPO_OWNER" || true
          done
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_OWNER: ${{ github.repository_owner }}
